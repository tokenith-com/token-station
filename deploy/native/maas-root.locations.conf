# Include in the tokenstation-test.centlt.com HTTPS server block.
location ~ ^/(api|v1|v1beta)/ {
    client_max_body_size 32m;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Forwarded "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/tokenstation-alipay-test.log tokenstation_alipay_test if=$tokenstation_log_alipay;
}

# Keep browser returns from payment orders created before the cutover working.
location = /maas/balance-recharge/ {
    return 302 /balance-recharge/$is_args$args;
}

location / {
    root /opt/tokenstation/maas/current/maas;
    index index.html;
    try_files $uri $uri/ =404;
}
