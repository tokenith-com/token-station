name: Native release assets

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed semantic GitHub Release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.repository }}-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.1

jobs:
  prepare:
    name: Prepare native release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          raw_tag="$INPUT_TAG"
          if [[ "$EVENT_NAME" == "release" ]]; then
            raw_tag="$RELEASE_TAG"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            raw_tag="$PUSH_TAG"
          fi

          version="$(.github/release/normalize-release-tag.sh "$raw_tag")"
          git merge-base --is-ancestor "refs/tags/$raw_tag^{commit}" refs/remotes/origin/release || {
            echo "Release tags must point to commits on the release branch." >&2
            exit 1
          }
          echo "tag=v${version}" >>"$GITHUB_OUTPUT"
          echo "version=${version}" >>"$GITHUB_OUTPUT"

  frontend:
    name: Build native frontend (linux/${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: maas-ui/package-lock.json
          package-manager-cache: false

      - name: Build standalone frontend
        working-directory: maas-ui
        env:
          ARCH: ${{ matrix.arch }}
          NEXT_PUBLIC_TOKENHUB_API_BASE_URL: ${{ vars.NEXT_PUBLIC_TOKENHUB_API_BASE_URL || '/maas-api' }}
        run: |
          set -euo pipefail
          npm ci
          npm run build

          bundle="../native-frontend-${ARCH}"
          mkdir -p "$bundle/frontend"
          cp -R out "$bundle/frontend/out"
          cp scripts/serve-static.mjs "$bundle/frontend/server.js"
          echo '{"type":"module"}' > "$bundle/frontend/package.json"
          tar -C "$bundle" -czf "../native-frontend-${ARCH}.tar.gz" frontend

      - name: Upload frontend bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tokenstation-native-frontend-${{ matrix.arch }}
          path: native-frontend-${{ matrix.arch }}.tar.gz
          compression-level: 0
          if-no-files-found: error

  backend:
    name: Build native backend (linux/${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build static backend
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "native-backend-${ARCH}"
          docker buildx build \
            --platform "linux/${ARCH}" \
            --file backend/Dockerfile.native \
            --target artifact \
            --build-arg "TOKENHUB_VERSION=${VERSION}" \
            --output "type=local,dest=native-backend-${ARCH}" \
            .
          test -x "native-backend-${ARCH}/tokenstation"
          file "native-backend-${ARCH}/tokenstation" | grep -q "statically linked"

      - name: Upload backend binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tokenstation-native-backend-${{ matrix.arch }}
          path: native-backend-${{ matrix.arch }}/tokenstation
          if-no-files-found: error

  package:
    name: Package native release (linux/${{ matrix.arch }})
    needs:
      - prepare
      - frontend
      - backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download frontend bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: tokenstation-native-frontend-${{ matrix.arch }}
          path: downloads/frontend

      - name: Download backend binary
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: tokenstation-native-backend-${{ matrix.arch }}
          path: downloads/backend

      - name: Download and verify Node.js runtime
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          node_arch="$ARCH"
          if [[ "$ARCH" == "amd64" ]]; then
            node_arch="x64"
          fi
          node_asset="node-v${NODE_VERSION}-linux-${node_arch}.tar.xz"
          node_base="https://nodejs.org/dist/v${NODE_VERSION}"
          curl -fsSLO "${node_base}/${node_asset}"
          curl -fsSLO "${node_base}/SHASUMS256.txt"
          grep "  ${node_asset}$" SHASUMS256.txt >node-checksum.txt
          sha256sum -c node-checksum.txt
          tar -xJf "$node_asset"
          mkdir -p downloads/node
          cp "node-v${NODE_VERSION}-linux-${node_arch}/bin/node" downloads/node/node

      - name: Assemble native archive
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          stage="stage-${ARCH}"
          archive="tokenstation_${VERSION}_linux_${ARCH}.tar.gz"
          mkdir -p "$stage/bin" "$stage/catalog" "$stage/deploy"
          tar -xzf "downloads/frontend/native-frontend-${ARCH}.tar.gz" -C "$stage"
          cp downloads/backend/tokenstation "$stage/bin/tokenstation"
          cp downloads/node/node "$stage/bin/node"
          cp deploy/native/tokenstation-run "$stage/bin/tokenstation-run"
          printf '%s\n' '#!/bin/sh' 'exec "$(dirname "$0")/tokenstation-run" "$@"' >"$stage/bin/tokenhub-run"
          chmod 0755 "$stage/bin/tokenhub-run"
          cp deploy/native/tokenstation.service "$stage/deploy/tokenstation.service"
          cp data/model-catalog.yaml "$stage/catalog/model-catalog.yaml"
          cp data/provider-catalog.json "$stage/catalog/provider-catalog.json"
          cp -rL data/builtin-plugins "$stage/catalog/builtin-plugins"
          cp LICENSE README.md "$stage/"
          printf '%s\n' "$VERSION" >"$stage/VERSION"
          chmod 0755 "$stage/bin/tokenstation" "$stage/bin/node" "$stage/bin/tokenstation-run"
          for required in \
            bin/tokenstation \
            bin/node \
            bin/tokenstation-run \
            frontend/server.js \
            catalog/model-catalog.yaml \
            catalog/provider-catalog.json \
            deploy/tokenstation.service \
            VERSION; do
            test -f "$stage/$required"
          done
          link_path="$(find "$stage" -type l -print -quit)"
          test -z "$link_path"
          test -f "$stage/catalog/builtin-plugins/providers/openai/plugin.yaml"
          test -f "$stage/catalog/builtin-plugins/platform/tokenhub.sim.default/plugin.yaml"

          source_date_epoch="$(git log -1 --format=%ct)"
          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "$stage" \
            -czf "$archive" \
            .
          tar -tzf "$archive" >/dev/null

          # Preserve the complete layout consumed by older production updaters.
          legacy_stage="legacy-${ARCH}"
          legacy_archive="tokenhub_${VERSION}_linux_${ARCH}.tar.gz"
          cp -rL "$stage" "$legacy_stage"
          mv "$legacy_stage/bin/tokenstation" "$legacy_stage/bin/tokenhub"
          python3 - "$legacy_stage" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for source, target in [('bin/tokenstation-run', 'bin/tokenhub-run'), ('deploy/tokenstation.service', 'deploy/tokenhub.service')]:
              path = root / source
              path.write_text(path.read_text().replace('tokenstation', 'tokenhub'))
              path.rename(root / target)
          PY
          test -z "$(find "$legacy_stage" -type l -print -quit)"
          tar --sort=name --mtime="@${source_date_epoch}" --owner=0 --group=0 --numeric-owner \
            -C "$legacy_stage" -czf "$legacy_archive" .
          tar -tzf "$legacy_archive" >/dev/null

      - name: Upload native archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tokenstation-native-archive-${{ matrix.arch }}
          path: |
            tokenstation_${{ needs.prepare.outputs.version }}_linux_${{ matrix.arch }}.tar.gz
            tokenhub_${{ needs.prepare.outputs.version }}_linux_${{ matrix.arch }}.tar.gz
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish native release assets
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download native archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: tokenstation-native-archive-*
          path: dist
          merge-multiple: true

      - name: Generate checksums and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum tokenstation_*.tar.gz tokenhub_*.tar.gz >checksums.txt
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            gh release create "$RELEASE_TAG" tokenstation_*.tar.gz tokenhub_*.tar.gz checksums.txt \
              --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --title "$RELEASE_TAG" \
              --notes "Linux amd64 and arm64 packages with the MaaS console. See the README at this tag for configuration and systemd deployment."
            exit 0
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" \
            tokenstation_*.tar.gz \
            tokenhub_*.tar.gz \
            checksums.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
