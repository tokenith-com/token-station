# TokenStation B 端（纯静态）nginx 配置
# 放置到 /etc/nginx/conf.d/tokenstation.conf
# 证书路径、域名、root、CSP 中的后端域名按实际环境替换

server {
    listen       443 ssl;
    http2        on;
    server_name  station.example.com;

    ssl_certificate     "/etc/nginx/certs/example.com.pem";
    ssl_certificate_key "/etc/nginx/certs/example.com.key";

    # 指向发布软链，切换版本只改软链
    root  /srv/tokenstation/b/current;
    index index.html;

    # 静态化后不再有动态路由，旧深链统一回落到列表页
    rewrite ^/plugins/[^/]+(/(files|settings))?/?$ /plugins/ permanent;
    rewrite ^/api-keys/[^/]+/usage/?$            /api-keys/ permanent;

    # /api serves the console. /v1 and /v1beta serve model clients.
    location ~ ^/(api|v1|v1beta)(/|$) {
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 带内容 hash 的构建产物：长缓存
    location /_next/static/ {
        expires 1y;
        try_files $uri =404;
    }

    # HTML 不缓存，发版立即生效
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # SPA 回落：/overview → /overview/index.html；未知路径 → 登录页
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全响应头（原本由 Next middleware 提供，静态化后落到 nginx）
    # 注意：location 里一旦出现 add_header，就不再继承这里的配置，
    # 所以下面各 location 只用 expires，不使用 add_header。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    # 静态 HTML 无法逐请求生成 nonce，script-src 只能使用 'unsafe-inline'。
    # connect-src 必须包含 .env.production 中配置的后端地址。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://hub.example.com https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    access_log /var/log/nginx/station.example.com.access.log;
    error_log  /var/log/nginx/station.example.com.error.log warn;
}